---
lima_k3s_gpu_mode: preflight

lima_k3s_instance: murakumo-gpu
lima_k3s_home: "{{ ansible_facts.env.HOME }}/.lima-murakumo-gpu"
lima_k3s_cpus: 4
lima_k3s_memory: 6GiB
lima_k3s_disk: 40GiB
lima_k3s_vm_type: krunkit
lima_k3s_force_recreate: false

murakumo_k3s_server_host: "{{ groups['control_plane'][0] }}"
murakumo_k3s_server_endpoint: "{{ murakumo_k3s_overlay_cidr_prefix }}.1"
murakumo_k3s_cluster_cidr: 10.42.0.0/16
murakumo_k3s_service_cidr: 10.43.0.0/16
murakumo_k3s_overlay_iface: wg0
murakumo_k3s_overlay_cidr_prefix: 10.77.0
murakumo_k3s_wireguard_port: 51820
murakumo_k3s_wireguard_persistent_keepalive: 25

murakumo_llama_vulkan_image: ghcr.io/etzhayyim-ai/murakumo-llama-vulkan:local
murakumo_llama_vulkan_manifest_dir: "{{ playbook_dir }}/../k8s/llama-vulkan"
murakumo_netd_source_dir: "{{ playbook_dir }}/../cmd/murakumo-netd"
murakumo_netd_build_dir: /tmp/murakumo-netd-build
