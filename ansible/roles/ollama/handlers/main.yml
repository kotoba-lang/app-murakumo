---
- name: restart ollama
  ansible.builtin.shell: |
    pkill -f 'ollama serve' 2>/dev/null || true
    sleep 2
    launchctl kickstart -k "gui/$(id -u)/com.etzhayyim.ollama.{{ inventory_hostname }}" 2>/dev/null || true
    launchctl kickstart -k "user/$(id -u)/com.etzhayyim.ollama.{{ inventory_hostname }}" 2>/dev/null || true
    launchctl load -w {{ ansible_facts.env.HOME }}/Library/LaunchAgents/com.etzhayyim.ollama.{{ inventory_hostname }}.plist 2>/dev/null || true
  changed_when: true
