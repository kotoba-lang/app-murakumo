---
- name: Check Homebrew is available
  ansible.builtin.stat:
    path: /opt/homebrew/bin/brew
  register: postgres_brew

- name: Fail fast when brew is absent
  ansible.builtin.fail:
    msg: "Homebrew not installed at /opt/homebrew/bin/brew"
  when: not postgres_brew.stat.exists

- name: Install PostgreSQL via brew
  community.general.homebrew:
    name: "postgresql@{{ postgres_version }}"
    state: present

- name: Resolve PostgreSQL prefix
  ansible.builtin.command:
    cmd: /opt/homebrew/bin/brew --prefix postgresql@{{ postgres_version }}
  register: postgres_prefix
  changed_when: false

- name: Set PostgreSQL path facts
  ansible.builtin.set_fact:
    postgres_bin_dir: "{{ postgres_prefix.stdout }}/bin"
    postgres_data_dir: "{{ ansible_facts.env.HOME }}/.etzhayyim/postgres"

- name: Ensure Postgres data directory exists
  ansible.builtin.file:
    path: "{{ postgres_data_dir }}"
    state: directory
    mode: "0700"

- name: Initialize Postgres cluster if missing
  ansible.builtin.command:
    cmd: "{{ postgres_bin_dir }}/initdb -D {{ postgres_data_dir }}"
    creates: "{{ postgres_data_dir }}/PG_VERSION"

- name: Probe whether Postgres is already listening
  ansible.builtin.shell: |
    lsof -iTCP:{{ postgres_port }} -sTCP:LISTEN 2>/dev/null | grep -q LISTEN
  register: postgres_listening
  changed_when: false
  failed_when: false
  check_mode: false

- name: Start Postgres
  ansible.builtin.shell: |
    "{{ postgres_bin_dir }}/pg_ctl" -D "{{ postgres_data_dir }}" \
      -l "{{ ansible_facts.env.HOME }}/.etzhayyim/postgres.log" \
      -o "-p {{ postgres_port }}" start
  when: postgres_listening.rc != 0
  changed_when: true

- name: Install @reboot crontab entry for Postgres
  ansible.builtin.cron:
    name: "postgres-control-plane"
    special_time: reboot
    job: >-
      {{ postgres_bin_dir }}/pg_ctl -D {{ postgres_data_dir }}
      -l {{ ansible_facts.env.HOME }}/.etzhayyim/postgres.log
      -o '-p {{ postgres_port }}' start
    state: present

- name: Wait for Postgres readiness
  ansible.builtin.shell: |
    "{{ postgres_bin_dir }}/pg_isready" -h 127.0.0.1 -p {{ postgres_port }}
  register: postgres_ready
  until: postgres_ready.rc == 0
  retries: 10
  delay: 3
  changed_when: false

- name: Ensure control-plane DB user exists
  ansible.builtin.shell: |
    "{{ postgres_bin_dir }}/psql" -h 127.0.0.1 -p {{ postgres_port }} -d postgres -v ON_ERROR_STOP=1 <<'SQL'
    DO $$
    BEGIN
      IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = '{{ postgres_db_user }}') THEN
        CREATE ROLE {{ postgres_db_user }} LOGIN PASSWORD '{{ postgres_db_password }}';
      END IF;
    END $$;
    SQL
  changed_when: false

- name: Ensure control-plane DB exists
  ansible.builtin.shell: |
    "{{ postgres_bin_dir }}/psql" -h 127.0.0.1 -p {{ postgres_port }} -d postgres -Atqc \
      "SELECT 1 FROM pg_database WHERE datname='{{ postgres_db_name }}'" | grep -q 1 \
      || "{{ postgres_bin_dir }}/createdb" -h 127.0.0.1 -p {{ postgres_port }} -O {{ postgres_db_user }} {{ postgres_db_name }}
  changed_when: false

- name: Install control-plane schema
  ansible.builtin.template:
    src: schema.sql.j2
    dest: "{{ ansible_facts.env.HOME }}/.etzhayyim/control-plane-schema.sql"
    mode: "0600"

- name: Apply control-plane schema
  ansible.builtin.command:
    cmd: "{{ postgres_bin_dir }}/psql -h 127.0.0.1 -p {{ postgres_port }} -d {{ postgres_db_name }} -f {{ ansible_facts.env.HOME }}/.etzhayyim/control-plane-schema.sql"
  changed_when: false
