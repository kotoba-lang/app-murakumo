---
# Murakumo Mac Mini M4 Fleet Inventory — V3 (Cloudflare Tunnel + serve_plain.py)
# All nodes: macOS Sequoia arm64 (M4 16GB)
# Architecture: serve_plain.py (Starlette + uvicorn + mlx_lm) + cloudflared tunnel
#
# SSH: user=node name, key=~/.ssh/id_ed25519
# IPs may change on reboot (DHCP) — use hostname-based mDNS where possible.

all:
  vars:
    # auto_silent falls back to /usr/bin/python3 when /opt/homebrew/bin/python3.11
    # is absent (e.g. levi). Explicit per-host override still possible.
    ansible_python_interpreter: auto_silent
    ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o ConnectTimeout=10"
    ansible_ssh_private_key_file: "~/.ssh/id_ed25519"
    etzhayyim_dir: "{{ ansible_facts.env.HOME }}/.etzhayyim"
    # Cloudflare Tunnel (still provisioned on all nodes; only the
    # litellm_gateway member routes public traffic — see ADR/CF Worker
    # rewire migration).
    cloudflared_tunnel_id: "ae341542-96bd-4ffd-8214-03188677e8cd"
    cloudflared_bin: /usr/local/bin/cloudflared

fleet:
  hosts:
    jacob:
      ansible_host: 127.0.0.1
      ansible_user: junkawasaki
      ansible_connection: local
    # Tribe hosts: ansible_host = mDNS .local for nodes that respond to it;
    # static IP for benjamin / asher (mDNS silent but L2 active per
    # fleet.toml 2026-05-21 verification + ADR-2605231630 Stage 3 unblocked).
    # Bare short-name aliases (e.g. `naphtali`) are still defined in
    # ~/.ssh/config (User + IdentityFile), so SSH works regardless.
    dan:
      ansible_host: dannomac-mini.local
      ansible_user: dan
    simeon:
      ansible_host: simeonnomac-mini.local
      ansible_user: simeon
    naphtali:
      ansible_host: naphtalinomac-mini.local
      ansible_user: naphtali
    levi:
      ansible_host: levinomac-mini.local
      ansible_user: levi
    benjamin:
      ansible_host: 192.168.1.14  # mDNS silent, see fleet.toml [[nodes]] benjamin.ip_lan
      ansible_user: benjamin
    joseph:
      ansible_host: josephnomac-mini.local
      ansible_user: joseph
    judah:
      ansible_host: judahnomac-mini.local
      ansible_user: judah
    issachar:
      ansible_host: issacharnomac-mini.local
      ansible_user: issachar
    zebulun:
      ansible_host: zebulunnomac-mini.local
      ansible_user: zebulun
    asher:
      ansible_host: 192.168.1.21  # mDNS silent, see fleet.toml [[nodes]] asher.ip_lan
      ansible_user: asher

# Head node: this Mac mini acts as the local control plane, LiteLLM gateway,
# Cloudflare ingress target, and the 11th Ollama worker.
# Other fleet nodes stay on LAN and do not need direct public ingress.
control_plane:
  hosts:
    jacob:

# LiteLLM proxy host: single node that runs the LiteLLM router in front of
# the Ollama fleet. Co-located with the local control plane.
litellm_gateway:
  hosts:
    jacob:

# Executor pool: start narrow. These hosts can later run leased browser/shell
# steps; the control plane remains authoritative for all workflow state.
executor_pool:
  hosts:
    jacob:
    dan:
    simeon:
    issachar:
