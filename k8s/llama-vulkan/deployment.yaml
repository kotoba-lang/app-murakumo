apiVersion: apps/v1
kind: Deployment
metadata:
  name: llama-vulkan
  namespace: murakumo-system
  labels:
    app.kubernetes.io/name: llama-vulkan
    app.kubernetes.io/part-of: murakumo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: llama-vulkan
  template:
    metadata:
      labels:
        app.kubernetes.io/name: llama-vulkan
        app.kubernetes.io/part-of: murakumo
    spec:
      hostNetwork: true
      dnsPolicy: Default
      containers:
        - name: llama-server
          image: ghcr.io/etzhayyim-ai/murakumo-llama-vulkan:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: LIST_DEVICES
              value: "1"
            - name: MODEL_REPO
              value: agentlans/SmolLM2-135M-Instruct-GGUF
            - name: MODEL_FILE
              value: Q4_K_M.gguf
            - name: MODEL_ALIAS
              value: smollm2-vulkan
            - name: N_GPU_LAYERS
              value: "99"
            - name: CTX_SIZE
              value: "2048"
            - name: THREADS
              value: "4"
          securityContext:
            privileged: true
          volumeMounts:
            - name: dri
              mountPath: /dev/dri
            - name: cache
              mountPath: /root/.cache
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 3
      volumes:
        - name: dri
          hostPath:
            path: /dev/dri
            type: Directory
        - name: cache
          persistentVolumeClaim:
            claimName: llama-vulkan-cache
